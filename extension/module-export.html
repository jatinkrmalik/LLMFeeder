<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Export Microsoft Learn Module</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { overflow: auto; min-width: 360px; }
      .export-page { max-width: 720px; margin: 0 auto; padding: 32px; }
      .export-page h1 { margin-bottom: 8px; }
      .export-page p { color: var(--dark-gray); }
      .export-actions { display: flex; gap: 12px; margin: 24px 0; }
      .export-progress { min-height: 48px; padding: 12px 0; }
      .export-errors { color: var(--error-color); white-space: pre-wrap; }
    </style>
  </head>
  <body class="light-theme">
    <main class="export-page">
      <h1>Microsoft Learn module export</h1>
      <p id="moduleName">Choose an output folder to export this module's units as Markdown files.</p>
      <div class="export-actions">
        <button id="startExportBtn" class="primary-btn" type="button">Choose folder and export</button>
        <button id="cancelExportBtn" class="secondary-btn hidden" type="button">Cancel</button>
      </div>
      <div id="exportProgress" class="export-progress">Ready</div>
      <div id="exportErrors" class="export-errors"></div>
    </main>
    <script src="libs/jszip.min.js"></script>
    <script src="settings.js"></script>
    <script src="module-export-utils.js"></script>
    <script src="module-export.js"></script>
  </body>
</html>
